# LEO-inspired scenario: alternating high (50 Mbps) and low (5 Mbps) capacity,
# simulating abrupt satellite handover effects. RTT 60 ms (LEO-ish).
#
# nimbus-measurement's mm-link fork expects a single bw value, so this config
# uses the higher bound. For true handover effects drive mm-link with an
# LEO-inspired .up/.down trace generated by network_emulation/leo_trace.py
# instead of going through nimbus-measurement.

[[link]]
bw = ['50mbps', '5mbps']
rtt = '60ms'
qsize = '1 bdp'

[[link.mm_link_queue]]
name = "droptail"
_qsize_arg = "packets=$qsize_pkts"

[[traffic]]
[[traffic.'#1']]
type = 'mpcc'
dport = 4242
duration_sec = 60
solver = 'qp'
horizon = 12

[[traffic.'#2']]
type = 'iperf'
cca = ['cubic', 'bbr']
dport = 4243
duration_sec = 60
