planner:
  horizon: 12
  timestep: 0.020

network:
  rtt_prop: 0.060
  tau_rtt: 0.15
  tau_tput: 0.15
  rate_max: 60.0e6
  alpha: 0.200
  rtt_target: 0.120
  q_max: 300000
  n_flows: 1

# LEO handovers produce abrupt capacity drops (baseline ~50 Mbps -> ~5 Mbps
# within a few hundred ms) and occasional outages. Compared to cellular:
#   - horizon extended to 12 so the planner sees through a typical handover dip.
#   - contour_weight further raised so the tracker pulls aggressively back onto
#     the curve after a discontinuity.
#   - acceleration_weight raised again: the paper calls out oscillation on
#     abrupt transitions as the dominant failure mode for reactive baselines.
weights:
  contour_weight: 120.0
  contouring_lag_weight: 1.0
  delay_weight: 30.0
  power_weight: 0.05
  acceleration_weight: 4.0
  fairness_weight: 0.0
