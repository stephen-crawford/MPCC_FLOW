planner:
  horizon: 8
  timestep: 0.020

network:
  rtt_prop: 0.040
  tau_rtt: 0.1
  tau_tput: 0.1
  rate_max: 60.0e6
  alpha: 0.060
  rtt_target: 0.050
  q_max: 200000
  n_flows: 1
  # Path-progress-rate cap (units 1/s). With dt=20 ms and v_theta_max=5, the
  # planner can move at most 0.1 of the curve per step.
  v_theta_max: 5.0

weights:
  contour_weight: 50.0
  contouring_lag_weight: 1.0
  delay_weight: 100.0
  power_weight: 0.1
  acceleration_weight: 0.5
  fairness_weight: 0.0
  # Progress reward (paper Sec. IV). w_theta > 0 is required for the
  # controller to choose non-zero v_theta; at 0 it parks at theta=0.
  theta_progress_weight: 10.0
